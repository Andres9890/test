name: Auto Archive Repos to IA
run-name: "Git Auto Archive [${{ github.event.schedule || inputs.url }}]"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Repository URL to archive
        required: true
        type: string

  schedule:
    # Use the same cron strings as keys in the GIT_ARCHIVE_SCHEDULES
    # Actions repository variable. Cron times are UTC.
    - cron: '17 */3 * * *'

permissions: {}

jobs:
  archive:
    # Example variable: {"17 */3 * * *":["https://github.com/owner/repo"]}
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        fromJSON(vars.GIT_ARCHIVE_SCHEDULES || '{}')[github.event.schedule][0]
      }}
    name: Archive ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: >-
          ${{
            github.event_name == 'workflow_dispatch' && fromJSON(format('[{0}]', toJSON(inputs.url))) ||
            fromJSON(vars.GIT_ARCHIVE_SCHEDULES)[github.event.schedule]
          }}
    concurrency:
      group: git-auto-archive-${{ matrix.repo }}
      cancel-in-progress: false
    env:
      REPO_URL: ${{ matrix.repo }}

    steps:
      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache pip downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: git-archive-pip-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}

      - name: Install archive tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install internetarchive iagitbetter iagitup aiohttp

      - name: Configure IA CLI
        env:
          IA_EMAIL: ${{ secrets.GIT_IA_EMAIL }}
          IA_PASSWORD: ${{ secrets.GIT_IA_PASSWORD }}
        run: |
          mkdir -p "$HOME/.config/internetarchive"
          printf '%s\n%s\n' "$IA_EMAIL" "$IA_PASSWORD" | ia configure

      - name: Run iagitbetter
        id: iagitbetter
        run: iagitbetter --all-branches --releases 5 -- "$REPO_URL"

      - name: Run iagitup
        if: ${{ !cancelled() && (steps.iagitbetter.outcome == 'success' || steps.iagitbetter.outcome == 'failure') }}
        run: iagitup -- "$REPO_URL"
